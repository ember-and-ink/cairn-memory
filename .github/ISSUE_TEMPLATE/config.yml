# Keep blank issues available — a quick freeform note is often faster than a form.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/ember-and-ink/cairn-memory/security/advisories/new
    about: Report privately, not as a public issue. See SECURITY.md.
  - name: A SillyTavern problem, not a Cairn one
    url: https://github.com/SillyTavern/SillyTavern/issues
    about: If it still happens with Cairn disabled, it belongs upstream.
