name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names below are required checks in the `main` ruleset,
# and Dependabot PRs auto-merge on them. Rename a job or change the Node matrix
# and the ruleset has to change with it, or every PR waits on a check that
# never reports.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make lint
      # verify-st needs a SillyTavern checkout and stays local; this one does not.
      - run: make verify-rules

  # SillyTavern declares engines.node ">= 20"; 22 is its Docker LTS and 24 its
  # CI runtime, so we cover the range a user could plausibly be on.
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: make test

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: manifest.json and package.json agree
        run: make version-check
      # Dependabot bumps dev tooling only — nothing it touches ships, so no release.
      # The step is skipped, not the job: `Version` still reports for the ruleset.
      - name: Version bumped since the base branch
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          set -euo pipefail
          current=$(node -p "require('./manifest.json').version")
          base=$(git show origin/${{ github.base_ref }}:manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$current" = "$base" ]; then
            echo "✗ version is still $base — bump manifest.json and package.json."
            exit 1
          fi
          echo "✓ $base -> $current"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for leaked secrets
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner -v
